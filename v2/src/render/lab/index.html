<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0912; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed; top: 10px; left: 10px; padding: 8px 12px; border-radius: 8px;
        font: 12px/1.45 ui-monospace, Menlo, monospace; color: #f3eee6;
        background: rgba(18, 12, 28, 0.82); border: 1px solid rgba(255, 215, 120, 0.25);
        white-space: pre; pointer-events: auto;
      }
      #hud button { font: inherit; margin: 4px 4px 0 0; background: #2a1d3d; color: #f3eee6;
        border: 1px solid rgba(255,215,120,.3); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
      body.clean #hud { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
