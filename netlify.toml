[build]
  # v2 (Three.js) lives in v2/; the Vite v1 game at the repo root is no longer built.
  base = "v2"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: the magic-link return lands on / with a hash, but any
# other path should still serve the app rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
